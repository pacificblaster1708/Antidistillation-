# CPU only, single process. For running the test suite on a laptop with no GPU.
# Never use this for real training -- it is thousands of times slower.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: 'NO'
machine_rank: 0
main_training_function: main
mixed_precision: 'no'
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: true
