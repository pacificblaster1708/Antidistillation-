[project]
name = "topk-soft-distillation"
version = "1.1.1"
description = "Resumable, cache-validated top-K soft distillation with a tail-mass KL objective."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.45.0,<5.0.0",
    "tokenizers>=0.20.0",
    "datasets>=3.0.0",
    "accelerate>=1.2.0",
    "peft>=0.14.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
flash = ["flash-attn==2.7.4.post1"]
dev = ["pyflakes", "ruff"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501"]
